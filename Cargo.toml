[package]
name = "imsg-server"
version = "0.1.0"
edition = "2021"
description = "iMessage bridge server for flip phones: talks to Apple via rustpush and serves phones over a small TLS push protocol"
license = "AGPL-3.0-only"

[dependencies]
rustpush = { path = "third_party/rustpush", default-features = false, features = ["remote-anisette-v3"] }
keystore = { path = "third_party/rustpush/keystore" }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
plist = "1.7"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
hyper = { version = "0.14", features = ["http1", "server", "runtime", "stream"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
hmac = "0.12"
openssl = "0.10"

[profile.release]
lto = "thin"
